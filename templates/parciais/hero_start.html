<div class="container-fluid py-5 mb-5 hero-header">
    <div class="container py-5">
        <div class="row g-5 align-items-center">
            <div class="col-md-12 col-lg-7">
                <h4 class="mb-3 text-secondary" style="margin-top: -25%;">Chopp 100% Gelado</h4>
                <h1 class="mb-5 display-3 text-primary">Absateça seu evento</h1>
                <div class="position-relative mx-auto">
                    
                    <form method="post" id="cidadeForm" action="{% url 'home' 1 %}">
                        {% csrf_token %}
                        <label for="">Selecione a Cidade do Evento</label>
                    
                        <select name="cidade" id="cidadeSelect" class="form-control border-2 border-secondary w-75 py-3 px-4 rounded-pill">
                            {% for cidade in cidades %}
                                <option value="{{ cidade.id }}">{{ cidade.nome }}</option>
                            {% endfor %}
                        </select>
                    
                        <button type="submit" class="btn btn-primary border-2 border-secondary py-3 px-4 rounded-pill text-white" style="top: 0; right: 25%;">Consultar</button>
                    </form>
                </div>
            </div>
            <div class="col-md-12 col-lg-5">
                <div id="carouselId" class="carousel slide position-relative" data-bs-ride="carousel" data-bs-interval="2000">
                    <div class="carousel-inner" role="listbox">
                        <div class="carousel-item rounded active">
                            <img src="/static/img/chopp2.webp" class="img-fluid w-100 h-100 bg-secondary rounded" alt="First slide">
                            <a href="#" class="btn px-4 py-2 text-white rounded">Eventos</a>
                        </div>
                        {% for img in imagens %}
                            <div class="carousel-item rounded">
                                <img src="{{ img.imagem.url }}" class="img-fluid w-100 h-100 bg-secondary rounded" alt="Slide">
                                <a href="#" class="btn px-4 py-2 text-white rounded">{{img.tipo}}</a>
                            </div>
                        {% endfor %}
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselId" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselId" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById("cidadeForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Impede o envio automático
        let cidadeId = document.getElementById("cidadeSelect").value;
        if (cidadeId) {
            this.action = `/home/${cidadeId}/#destaques`; // Atualiza a URL dinamicamente com o ID da cidade selecionada
            this.submit(); // Submete o formulário com a nova action
        }
    });
</script>
