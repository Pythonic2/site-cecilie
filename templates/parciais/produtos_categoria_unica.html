{% for parceiro in parceiros %}
{% if parceiro.usuario.status_pagamento%}
<div class="col-md-4 mb-3">
    <div class="border border-primary rounded position-relative vesitable-item">
        
        <div class="vesitable-img">
            <img src="{{ parceiro.imagem.url }}" class="img-fluid w-100 rounded-top" alt="">
        </div>
        <div class="text-white bg-primary px-3 py-1 rounded position-absolute" style="top: 10px; right: 10px;">Verificado</div>
        <div class="p-3 rounded-bottom">
            <h5 style="color: black;">{{parceiro.usuario.username}} - {{ parceiro.nome }}</h5>
            <p>{{ parceiro.cidade }}</p>
            <div class="d-flex justify-content-between flex-lg-wrap">
                <!-- <p class="text-dark fs-6 fw-bold mb-0">R${{ parceiro.numero }}</p> -->
                <a href="#" class="btn border border-secondary rounded-pill px-3 text-primary">
                    <i class="fa fa-shopping-bag me-2 text-primary"></i> Conhecer
                </a>
            </div>
        </div>
    </div>
</div>
{%else%}
{%endif%}
{% endfor %}
