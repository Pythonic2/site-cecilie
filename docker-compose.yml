services:
  plataforma-chopp:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    ports:
      - "8004:8004"
    networks:
      - pi_default
    volumes:
      - plataforma_chopp_data:/var/lib/postgresql/data
      - plataforma_chopp_app:/app/media
    command: >
      sh -c "apt update && apt install -y nano && mkdir -p /app/main && echo '{}' > /app/main/dona-calendario.json"
